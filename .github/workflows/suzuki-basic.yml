name: Suzuki basic decoding demo (compile and run)

on:
  push:
    branches:
      - docs/miura-basic-decoding-2026-11-12
    paths:
      - "suzuki_basic.c"
      - ".github/workflows/suzuki-basic.yml"
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile demo
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o suzuki_basic suzuki_basic.c
      - name: Run demo
        run: ./suzuki_basic
