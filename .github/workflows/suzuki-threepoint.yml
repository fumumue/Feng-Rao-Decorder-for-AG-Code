name: Suzuki three-point basic decoding prototype
on:
  push:
    branches:
      - docs/miura-basic-decoding-2026-11-12
    paths:
      - "suzuki_threepoint.c"
      - "suzuki_threepoint.md"
      - ".github/workflows/suzuki-threepoint.yml"
  workflow_dispatch:
jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o suzuki_threepoint suzuki_threepoint.c
      - name: Help
        run: ./suzuki_threepoint --help
      - name: Run three-point test
        run: ./suzuki_threepoint --a 10 --b 10 --c 10 --errors 2 --seed 7
