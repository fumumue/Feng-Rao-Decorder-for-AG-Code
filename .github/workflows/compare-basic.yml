name: Miura and Suzuki basic decoding comparison

on:
  push:
    branches:
      - docs/miura-basic-decoding-2026-11-12
    paths:
      - "myu.c"
      - "suzuki_multipoint.c"
      - "suzuki_threepoint.c"
      - ".github/workflows/compare-basic.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Miura
        run: cc -O2 -std=c11 -Wall -Wextra -o miura myu.c
      - name: Run Miura default-parameter trials
        run: ./miura --p 2 --m 6 --a 3 --b 4 --m0 20 --ms 6,6 --trials 30 --seed 1
      - name: Compile Suzuki two-point
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o suzuki_two suzuki_multipoint.c
      - name: Run Suzuki two-point tests
        run: |
          for errors in 3 4; do
            for seed in 1 2 3 4 5; do
              ./suzuki_two --a 14 --b 14 --errors "$errors" --seed "$seed"
            done
          done
      - name: Compile Suzuki three-point
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o suzuki_three suzuki_threepoint.c
      - name: Run Suzuki three-point tests
        run: |
          for errors in 1 2 3; do
            for seed in 1 2 3 4 5; do
              ./suzuki_three --a 10 --b 10 --c 10 --errors "$errors" --seed "$seed"
            done
          done
